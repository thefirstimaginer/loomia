
[workspace]
resolver = "3"
members = ["loomia-shared", "loomia-server", "loomia-client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "fs", "signal"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
bevy = "0.16"

# Perfis pensados para desenvolvimento: as dependências em modo release
# mantêm o cliente fluido mesmo compilado em modo debug.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
